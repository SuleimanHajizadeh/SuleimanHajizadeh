<svg width="350" height="195" viewBox="0 0 350 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="descId">
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">Most Used Languages across Suleiman Hajizadeh's 18 GitHub Organizations and Repositories</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #fe428e;
    }
    .lang-name {
      font: 500 12px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #a9fef7;
    }
    .lang-pct {
      font: 400 11.5px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #8b949e;
    }
  </style>

  <rect x="0.5" y="0.5" rx="6" height="99%" width="349" fill="#141321" stroke="none"/>

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <g transform="translate(25, 55)">
    <mask id="rect-mask">
      <rect x="0" y="0" width="300" height="10" fill="white" rx="5"/>
    </mask>
    <g mask="url(#rect-mask)">
      <rect x="0" y="0" width="118.2" height="10" fill="#3572A5"/>
      <rect x="118.2" y="0" width="71.4" height="10" fill="#f1e05a"/>
      <rect x="189.6" y="0" width="43.8" height="10" fill="#f34b7d"/>
      <rect x="233.4" y="0" width="35.4" height="10" fill="#e34c26"/>
      <rect x="268.8" y="0" width="19.2" height="10" fill="#198CE7"/>
      <rect x="288.0" y="0" width="12.0" height="10" fill="#DA5B0B"/>
    </g>

    <!-- Left Column -->
    <g transform="translate(0, 32)">
      <circle cx="6" cy="-4" r="5" fill="#3572A5"/>
      <text x="18" y="0" class="lang-name">Python <tspan class="lang-pct">39.4%</tspan></text>
    </g>
    <g transform="translate(0, 62)">
      <circle cx="6" cy="-4" r="5" fill="#f34b7d"/>
      <text x="18" y="0" class="lang-name">C / C++ <tspan class="lang-pct">14.6%</tspan></text>
    </g>
    <g transform="translate(0, 92)">
      <circle cx="6" cy="-4" r="5" fill="#198CE7"/>
      <text x="18" y="0" class="lang-name">R / Biostats <tspan class="lang-pct">6.4%</tspan></text>
    </g>

    <!-- Right Column -->
    <g transform="translate(155, 32)">
      <circle cx="6" cy="-4" r="5" fill="#f1e05a"/>
      <text x="18" y="0" class="lang-name">JavaScript / TS <tspan class="lang-pct">23.8%</tspan></text>
    </g>
    <g transform="translate(155, 62)">
      <circle cx="6" cy="-4" r="5" fill="#e34c26"/>
      <text x="18" y="0" class="lang-name">HTML5 / CSS3 <tspan class="lang-pct">11.8%</tspan></text>
    </g>
    <g transform="translate(155, 92)">
      <circle cx="6" cy="-4" r="5" fill="#DA5B0B"/>
      <text x="18" y="0" class="lang-name">Jupyter / Shell <tspan class="lang-pct">4.0%</tspan></text>
    </g>
  </g>
</svg>
